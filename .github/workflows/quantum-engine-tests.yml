name: Quantum Engine Tests

on:
  push:
    branches:
      - "feat/heavenzfire-quantum-state-engine-v0.1"
  pull_request:
    paths:
      - "quantum-engine/**"
      - ".github/workflows/quantum-engine-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
